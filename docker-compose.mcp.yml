services:
  mcp-lark:
    build:
      context: ./mcp-lark
      dockerfile: Dockerfile
    container_name: agents-mcp-lark
    ports:
      - "127.0.0.1:3101:3101"
    env_file:
      - ./mcp-lark/.env
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3101
      - MCP_PATH=/mcp
      - MCP_BEARER_TOKEN=${MCP_LARK_BEARER_TOKEN:-${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN or MCP_LARK_BEARER_TOKEN}}
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
