server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 代理后端 API 请求（使用变量延迟解析）
    location /generate {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/generate;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /dialog/generate {
        # 这里必须用 backend，因为这是 Docker 内部容器间的通信
        proxy_pass http://backend:8000/dialog/generate;
    
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # 这里的 Host 建议保留为 $host，或者干脆不设置，让它透传
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # 建议加上这些，方便后端获取真实客户端 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /session/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/session/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
