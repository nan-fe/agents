[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "mcp-lark"]
extend-exclude = [
  "backend/app/data",
  "backend/evalutor_planner.py",
  "backend/test_orchestrator_llm_service.py",
  "backend/upload_dataset.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
  "B008",
  "B904",
  "UP006",
  "UP035",
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"backend/app/main.py" = ["E402"]
"backend/tests/**" = ["B011", "E402", "F821"]
"**/test_*.py" = ["B011", "F821"]
"backend/app/utils/search_tool.py" = ["F821"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["backend/app"]
mypy_path = "backend:mcp-lark"
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
show_error_codes = true
exclude = [
  "backend/app/data/",
  "backend/evalutor_planner.py",
  "backend/upload_dataset.py",
]

[[tool.mypy.overrides]]
module = [
  "chromadb.*",
  "langchain.*",
  "langchain_community.*",
  "langchain_core.*",
  "langchain_openai.*",
  "langsmith.*",
  "replicate.*",
  "sse_starlette.*",
  "duckduckgo_search.*",
  "rank_bm25.*",
  "bs4.*",
  "playwright.*",
]
ignore_missing_imports = true
