[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "mcp-lark"]
extend-exclude = [
  "backend/app/data",
  "backend/evalutor_planner.py",
  "backend/test_orchestrator_llm_service.py",
  "backend/upload_dataset.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
  "B008",
  "B904",
  "UP006",
  "UP035",
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"backend/app/main.py" = ["E402"]
"backend/tests/**" = ["B011", "E402", "F821"]
"**/test_*.py" = ["B011", "F821"]
"backend/app/utils/search_tool.py" = ["F821"]

[tool.ruff.format]
quote-style = "double"
