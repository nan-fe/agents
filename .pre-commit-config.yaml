repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-changed
        name: pytest (changed Python files)
        entry: scripts/pre-commit-pytest.sh
        language: script
        pass_filenames: true
        types: [python]
        files: ^(backend|mcp-lark)/

      - id: frontend-share-lint
        name: frontend-share lint
        entry: bash -c 'cd frontend-share && pnpm lint'
        language: system
        pass_filenames: false
        files: ^frontend-share/
