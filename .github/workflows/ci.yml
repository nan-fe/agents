name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PNPM_VERSION: "10.30.3"
  NODE_VERSION: "22"
  AUTH_SECRET: ci-build-secret-minimum-32-characters
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xhs_auth
  # backend Settings (no .env in CI)
  API_KEY: test-api-key
  BASE_MODEL: deepseek-v4-flash
  MODEL_BASE_URL: https://example.com/v1
  COPYWRITE_MODEL: test-copywrite-model
  EMBEDING_MODEL: BAAI/bge-large-zh-v1.5
  GENARATION_MODEL: test-generation-model
  PLAN_MODEL: test-plan-model
  INTENT_MODEL: test-intent-model
  SILICONFLOW_API_KEY: test-siliconflow-key
  SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1
  IMAGE_MODEL: Kwai-Kolors/Kolors
  LANGCHAIN_API_KEY: test-langsmith-key
  LANGCHAIN_PROJECT: xhs-ci
  LANGCHAIN_TRACING_V2: "false"

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            mcp-lark/pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ../mcp-lark

      - name: Ruff
        run: |
          pip install -r ../requirements-dev.txt
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest tests/ -m "not network"

  mcp-lark:
    name: mcp-lark (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-lark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            mcp-lark/pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]" pytest pytest-asyncio
          pip install -r ../requirements-dev.txt

      - name: Ruff
        run: ruff check . && ruff format --check .

      - name: Run tests
        run: pytest tests/

  frontend-share:
    name: frontend-share (lint + unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-share
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend-share/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  frontend-share-e2e:
    name: frontend-share (Playwright smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-share
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xhs_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xhs_auth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend-share/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Playwright smoke tests
        run: pnpm test:e2e
        env:
          E2E_SKIP_POSTGRES: "1"
