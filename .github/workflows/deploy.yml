name: Build and Deploy Full-Stack App

on:
  push:
    branches: [ "feat-init" ]
    tags: [ "v*" ]

env:
  REGISTRY: crpi-qeygpng4u8e2ezh6.cn-shanghai.personal.cr.aliyuncs.com
  NAMESPACE: nan-fe
  IMAGE_NAME: agents

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- 将 Postgres 同步到 ACR（国内服务器无法稳定访问 docker.io）----------
      - name: Mirror Postgres to Aliyun ACR
        run: |
          docker pull postgres:16-alpine
          docker tag postgres:16-alpine ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:postgres
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:postgres

      # ---------- 构建和推送后端镜像 ----------
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:backend
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 构建和推送前端镜像 ----------
      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-ts
          file: ./frontend-ts/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:frontend
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-frontend
          build-args: |
            VITE_SHARE_BASE_URL=${{ vars.VITE_SHARE_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 构建和推送分享页镜像 ----------
      - name: Build and push Frontend Share
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-share
          file: ./frontend-share/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:frontend-share
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-frontend-share
          build-args: |
            STUDIO_UPSTREAM_URL=http://frontend:80
            API_UPSTREAM_URL=http://backend:8000
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_APPLICATION_ID=${{ vars.SENTRY_APPLICATION_ID || 'frontend-share' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 部署到 aliyun 服务器----------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # 服务器在国内，直连 github.com HTTPS 常失败（Empty reply from server）；
      # 镜像已在 ACR，此处只需同步 compose 等部署文件，不再 git pull。
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "/root/agents"
          overwrite: true

      - name: Deploy to Aliyun Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: AUTH_SECRET
          script: |
            set -euo pipefail
            mkdir -p /root/agents
            cd /root/agents

            if [ -z "${AUTH_SECRET:-}" ]; then
              echo "Missing GitHub Secret: AUTH_SECRET"
              echo "Add it at Settings → Secrets and variables → Actions"
              exit 1
            fi

            touch .env
            grep -v '^AUTH_SECRET=' .env > .env.tmp || true
            mv .env.tmp .env
            printf 'AUTH_SECRET=%s\n' "$AUTH_SECRET" >> .env

            echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login --username=${{ secrets.SSH_USER }} --password-stdin ${{ env.REGISTRY }}
            docker compose pull
            docker compose up -d
            docker image prune -f

            echo "Checking frontend-share migration logs..."
            docker logs agents-frontend-share --tail 20
