name: Build and Deploy Full-Stack App

on:
  push:
    branches: [ "feat-init" ]
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io
  # 镜像名称直接沿用仓库名，可以同步改成你自己的
  IMAGE_NAME_BACKEND: xhs-multi-agent-backend
  IMAGE_NAME_FRONTEND: xhs-multi-agent-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # 构建增强（多平台/缓存/SBOM）

      # ---------- 构建和推送后端镜像 ----------
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 构建和推送前端镜像 ----------
      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-ts
          file: ./frontend-ts/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 部署到服务器 (通过 SSH) ----------
  deploy:
    runs-on: self-hosted  # 使用自定义标签指定你的Runner
    needs: build-and-push
    permissions:
      contents: read
      packages: write
    steps:
        - name: Export all env vars from .env
          run: |
            cd /Users/lixuefu/Documents/trae_projects/agents/xhs-multi-agent-creator
            cp ./backend/.env .env || echo ".env already exists or not needed"
        # 关键：这一步是在你的服务器上执行的，无需SSH！
        # 因为Runner已经身处服务器，可以直接操作Docker
        - name: Log in to GHCR with PAT
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GHCR_PAT }}
        - name: Deploy Application
          run: |
              cd /Users/lixuefu/Documents/trae_projects/agents/xhs-multi-agent-creator
              docker compose down
              docker compose pull
              docker compose up -d
