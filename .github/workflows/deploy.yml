name: Build and Deploy Full-Stack App

on:
  push:
    branches: [ "feat-init" ]
    tags: [ "v*" ]

env:
  REGISTRY: crpi-qeygpng4u8e2ezh6.cn-shanghai.personal.cr.aliyuncs.com
  NAMESPACE: nan-fe
  IMAGE_NAME: agents

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- 构建和推送后端镜像 ----------
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:backend
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 构建和推送前端镜像 ----------
      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-ts
          file: ./frontend-ts/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:frontend
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 部署到 aliyun 服务器----------
  deploy:
    runs-on: ubuntu-latest  
    needs: build-and-push
    steps:
      - name: Deploy to Aliyun Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /root/agents
            
            git pull origin feat-init
            echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login --username=${{ secrets.SSH_USER }} --password-stdin ${{ env.REGISTRY }}
            docker compose pull
            docker compose up -d
            docker image prune -f
