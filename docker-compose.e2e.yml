# E2E / local test Postgres — avoids conflict with a host Postgres on :5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: agents-postgres-e2e
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xhs_auth
    ports:
      - "5433:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d xhs_auth']
      interval: 5s
      timeout: 5s
      retries: 5
