services:
  postgres:
    # 与 backend/frontend 同源：由 CI 从 docker.io 同步到阿里云 ACR，避免服务器直连 Docker Hub
    image: crpi-qeygpng4u8e2ezh6.cn-shanghai.personal.cr.aliyuncs.com/nan-fe/agents:postgres
    container_name: agents-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xhs_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d xhs_auth']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: crpi-qeygpng4u8e2ezh6.cn-shanghai.personal.cr.aliyuncs.com/nan-fe/agents:backend
    container_name: agents-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SHARE_STORE_PATH=/data/shares/shares.json
      - DATABASE_URL=sqlite+aiosqlite:////data/memory/memory.db
      - CHROMA_DB_PATH=/data/chroma_taobao_v1
    env_file:
      - ./backend/.env
    volumes:
      - ./data/shares:/data/shares
      - ./data/memory:/data/memory
      - ./data/chroma:/data/chroma_taobao_v1
    networks:
      - app-network
    restart: unless-stopped

  frontend-share:
    image: crpi-qeygpng4u8e2ezh6.cn-shanghai.personal.cr.aliyuncs.com/nan-fe/agents:frontend-share
    container_name: agents-frontend-share
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:8000
      - API_UPSTREAM_URL=http://backend:8000
      - AUTH_SECRET=${AUTH_SECRET:-change-me-in-production}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/xhs_auth
      - SENTRY_DSN=${SENTRY_DSN:-https://DYwAS6KnxQkz9CnaCzMWiLNh@s2461160.eu-nbg-2.betterstackdata.com/2461176}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-https://DYwAS6KnxQkz9CnaCzMWiLNh@s2461160.eu-nbg-2.betterstackdata.com/2461176}
      - AUTH_SECRET=${AUTH_SECRET:-change-me-in-production}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID:-}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET:-}
      - AUTH_URL=${AUTH_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
